<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal finance tracker for individuals and freelancers. Track assets, liabilities, net worth, income, expenses, and goal budgets." />
    <meta name="theme-color" content="#007c7c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <title>Project Ceres</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ceres.theme:v1');
          var theme = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          var root = document.documentElement;
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) { /* private mode, etc. — fall through to React's effect-driven application */ }
      })();
    </script>
    <script>
      (function () {
        try {
          var c = localStorage.getItem('ceres.sidebar.collapsed');
          if (c === 'true') document.documentElement.classList.add('sidebar-collapsed');
        } catch (e) {}
      })();
    </script>
    <script>
      // Zod 4 JIT eval-probe suppression. Our strict CSP (Stage 14) has no
      // 'unsafe-eval'; Zod feature-detects eval by calling Function() once, whose
      // caught throw still emits a CSP securitypolicyviolation (logged by
      // /api/csp-report) on every page that runs the forms chunk. Pre-populating
      // __zod_globalConfig before any module loads makes Zod skip the probe
      // entirely — the only ordering-proof hook (a config() call in bundled app
      // code runs too late: the probe fires during schema-module eval first).
      // No behaviour change: eval is already disallowed, so the JIT path was never
      // taken. Hashed into csp-hashes.json by compute-csp-hashes.mjs (reads app.html).
      window.__zod_globalConfig = { jitless: true };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
