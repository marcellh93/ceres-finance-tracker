name: CI

on:
  push:
    branches: [main]
  pull_request:            # dormant — no PR workflow today; armed for the future
  workflow_dispatch:       # manual "Run workflow" button

# Least-privilege GITHUB_TOKEN for every job (CodeQL actions/missing-workflow-permissions).
# Without this, the token defaults to the repo-wide setting, which can be read/write. No job
# here pushes commits, comments on PRs, publishes packages, or creates releases — they only
# check out the repo and run tests. `actions/upload-artifact` (e2e traces) uses the Actions
# API and needs no contents:write. So the whole workflow needs only contents: read. A job
# that later needs more (e.g. a CD image push, §16.11) adds its own narrower `permissions:`.
permissions:
  contents: read

# Supersede in-flight runs on rapid pushes to the same ref (saves minutes;
# does not hide failures within a run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-test:
    runs-on: ubuntu-latest
    # This job has no pnpm/Node. ProjectCeres's BuildTailwind target shells out
    # to `pnpm run build:css` on every build (provision's ef build, the test
    # build, and dotnet test). CSS is irrelevant to the server test suite, so
    # skip Tailwind job-wide.
    env:
      SkipTailwind: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install dotnet-ef (global, pinned to EF Core version) + on PATH
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore ProjectCeres (so dotnet ef can build it)
        run: dotnet restore ProjectCeres/ProjectCeres.csproj
      - name: Provision + migrate the test databases
        # Stage 12.18: --template --clones 4 migrates one template then clones the
        # 4 parallel bucket DBs (project_ceres_test_1..4) + 5 serial-collection DBs,
        # so the integration suite runs in parallel with per-bucket isolation.
        # project_ceres_test_e2e (legacy single-DB mode) is still needed by
        # E2eDatabaseGuardStartupCheckTests, which connects to it to prove the guard
        # passes against the correct DB. A clean runner has none of these.
        run: |
          which dotnet-ef && dotnet-ef --version
          tools/ci/setup-test-db.sh --template --clones 4
          tools/ci/setup-test-db.sh project_ceres_e2e
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - uses: pnpm/action-setup@v5
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install client deps (for the SPA stage below)
        run: pnpm --dir ProjectCeres.Client install --frozen-lockfile
      - name: Stage the SPA bundle into wwwroot/dist
        # DashboardApiTests.GetDashboardRoot_ServesSpaShell asserts the SPA fallback
        # serves the built shell (200 text/html). wwwroot/dist is gitignored and
        # only produced by a Release build or this script, so a clean runner 404s
        # without it. SkipTailwind is fine — this stages the Vite SPA, not site.css.
        run: tools/stage-spa.sh
      - name: Build
        run: dotnet build ProjectCeres.Tests/ProjectCeres.Tests.csproj
      - name: Full test suite
        # No secret env var needed: WafCollection.cs supplies Authentication:TokenLookupSecret:Secret
        # itself via UseSetting (the Stage 12.12 fix), so the integration suite is self-sufficient
        # on secrets — it needs only a reachable Postgres. E2E generates its own in run-server.sh.
        #
        # Stage 12.18: run PARALLEL here. CERES_TEST_DB_CLONES=4 flips the router out of the
        # N=1 fallback so each bucket collection targets its own clone DB; the xUnit `--`
        # overrides enable collection parallelism (xunit.runner.json keeps it OFF by default
        # so a local `dotnet test` without clones stays serial and race-free). ~2x faster than
        # serial (verified locally 1390/1390 in ~2m vs ~4-5m).
        run: >-
          dotnet test ProjectCeres.Tests/ProjectCeres.Tests.csproj --no-build
          -- xUnit.ParallelizeTestCollections=true xUnit.MaxParallelThreads=4
        env:
          CERES_TEST_DB_CLONES: "4"

  analyzer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore (populates the CodeAnalysis.Testing ref-pack cache)
        run: dotnet restore ProjectCeres.Analyzers.Tests/ProjectCeres.Analyzers.Tests.csproj
      - name: Analyzer tests
        run: dotnet test ProjectCeres.Analyzers.Tests/ProjectCeres.Analyzers.Tests.csproj

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v5
        with:
          # Explicit version — NOT package_json_file. Our packageManager pin
          # carries a full "+sha512.…/…" hash that action-setup@v4 misparses as
          # a local directory path, "installing" a bogus pnpm@0.0.0 with no
          # binary. An exact version string sidesteps that entirely.
          version: "10.33.2"
      - name: pnpm on PATH?
        run: which pnpm && pnpm --version
      - name: Install
        run: pnpm --dir ProjectCeres.Client install --frozen-lockfile
      - name: Build (tsc + vite + check-size)
        run: pnpm --dir ProjectCeres.Client build
      - name: Vitest
        run: pnpm --dir ProjectCeres.Client test

  e2e:
    runs-on: ubuntu-latest
    # E2E asserts the Vite-built SPA stylesheet (wwwroot/dist, built by pnpm in
    # run-server.sh), not the Razor site.css. The server's `dotnet run` build
    # would otherwise fire BuildTailwind → pnpm from an MSBuild subprocess whose
    # PATH drops the pnpm shim. Skip Tailwind; the SPA CSS is unaffected.
    env:
      SkipTailwind: "true"
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install dotnet-ef (global, pinned to EF Core version) + on PATH
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore ProjectCeres (so dotnet ef can build it)
        run: dotnet restore ProjectCeres/ProjectCeres.csproj
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v5
        with:
          # Explicit version — NOT package_json_file. Our packageManager pin
          # carries a full "+sha512.…/…" hash that action-setup@v4 misparses as
          # a local directory path, "installing" a bogus pnpm@0.0.0 with no
          # binary. An exact version string sidesteps that entirely.
          version: "10.33.2"
      - name: pnpm on PATH?
        run: which pnpm && pnpm --version
      - name: Install client deps
        run: pnpm --dir ProjectCeres.Client install --frozen-lockfile
      - name: Resolve Playwright version (for the cache key)
        id: pw
        # Read the declared version straight from package.json — a single clean
        # value. The earlier `pnpm ls --parseable | sed` emitted two path lines,
        # corrupting the $GITHUB_OUTPUT single-line protocol.
        run: |
          V="$(node -p "require('./ProjectCeres.Client/package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")"
          echo "version=${V:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm --dir ProjectCeres.Client exec playwright install --with-deps ${{ matrix.project }}
      - name: E2E (${{ matrix.project }})
        run: pnpm --dir ProjectCeres.Client exec playwright test --config e2e/playwright.golden.config.ts --project=${{ matrix.project }}
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Upload traces + report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.project }}
          path: ProjectCeres.Client/e2e/.artifacts/
          retention-days: 7

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # gitleaks scans history
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v5
        with:
          # Explicit version — NOT package_json_file. Our packageManager pin
          # carries a full "+sha512.…/…" hash that action-setup@v4 misparses as
          # a local directory path, "installing" a bogus pnpm@0.0.0 with no
          # binary. An exact version string sidesteps that entirely.
          version: "10.33.2"
      - name: pnpm on PATH?
        run: which pnpm && pnpm --version
      - name: Vulnerable-package scan (fail on any finding)
        run: |
          dotnet restore ProjectCeres.sln 2>/dev/null || dotnet restore
          OUT="$(dotnet list package --vulnerable --include-transitive 2>&1 || true)"
          echo "$OUT"
          # dotnet list --vulnerable always exits 0; it prints "has no vulnerable packages"
          # for a clean project. Fail if that success sentinel is missing OR a severity is reported.
          if echo "$OUT" | grep -qiE '\b(Critical|High|Moderate|Low)\b' \
             || ! echo "$OUT" | grep -q 'has no vulnerable packages'; then
            echo "::error::Vulnerable package(s) reported by dotnet list --vulnerable"; exit 1
          fi
      - name: Secret scan (gitleaks)
        # Run the pinned gitleaks BINARY directly, not gitleaks/gitleaks-action@v3.
        # The v3 action requires a paid GITLEAKS_LICENSE for org accounts and validates
        # it via a GitHub API call that intermittently hits the rate limit and hard-fails
        # the job ("missing gitleaks license") even though no secret was found — a flake
        # that reddened an unrelated docs-only push on 2026-09-11 (Stage 12.14). The binary
        # has no license gate. `git` scans full history (checkout uses fetch-depth: 0);
        # --exit-code 1 fails the job on any finding; --redact keeps secrets out of logs.
        # See docs/runbooks/ci-actions-troubleshooting.md § gitleaks.
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --exit-code 1
      - name: Node hook self-tests
        run: bash scripts/test-hooks.sh
      - name: Roadmap marker/status consistency
        run: |
          for f in docs/roadmap-phase-*.md; do
            node -e "const fs=require('fs');const {scan}=require('./.claude/hooks/roadmap-consistency-check.js');const g=scan(fs.readFileSync(process.argv[1],'utf8'));if(g.length){console.error(process.argv[1]+':');g.forEach(x=>console.error('  '+x));process.exit(1)}" "$f"
          done
          echo "roadmaps consistent"
      # Runs LAST: the JS advisory set (17 open, tracked for a dedicated triage
      # pass — pnpm overrides per ADR-0079 + bumps) is a known red today. Keeping
      # it last means gitleaks, the hook self-tests, and the roadmap check all run
      # and report even while this gate is failing. It still fails the job.
      - name: Client dependency audit (pnpm)
        run: |
          pnpm --dir ProjectCeres.Client install --frozen-lockfile
          pnpm --dir ProjectCeres.Client audit --audit-level high
